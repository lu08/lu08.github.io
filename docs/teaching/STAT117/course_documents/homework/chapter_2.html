## Examining Univariate Distributions

### Exercise 2.1

Create a frequency distribution table of the variable `ABSENT12`, which gives the number of times a student was absent in twelfth grade. Use the frequency distribution to answer the following questions:

a) How many students in the NELS data set were absent 3–6 times in twelfth grade?

b) How many students in the NELS data set were absent exactly 3 times in twelfth grade?

c) What percentage of students in the NELS data set was absent 3–6 times in twelfth grade?

d) What percentage of students in the NELS data set was absent 6 or fewer times in twelfth grade?

<details>
<summary>### Solution</summary>

a) 180 students.

b) It is impossible to know the exact number. Assuming equal numbers of students were absent 3, 4, 5, and 6 times, the estimate is 180 / 4 = 45 students.

c) 36%.

d) 86%.

</details>

### Exercise 2.2

Create a frequency distribution table of the variable `PARMARL8`, which gives the marital status of the parents when the student was in eighth grade. Use it and the Data View window to answer the following questions:

a) What does a score of 3 indicate on the variable `PARMARL8`?

b) For how many students in the NELS data set was `PARMARL8 = 3`?

c) For what percentage of students in the NELS data set was `PARMARL8 = 3`? Interpret both the values from the percent and valid percent columns.

d) Why is the cumulative percent column of `PARMARL8` not meaningful?

<details>
<summary>### Solution</summary>

a) The student’s parents were separated when the student was in eighth grade.

b) 8 students.

c) Of students who reported their parents’ marital status in eighth grade, 1.7% reported that their parents were separated. Of all students in the NELS data set, 1.6% reported that their parents were separated.

d) `PARMARL8` is nominal, so its categories have no intrinsic ordering. The numerical codes are assigned arbitrarily, so cumulative percentages are not meaningful.

</details>

### Exercise 2.3

Create a frequency distribution table of the variable `FAMSIZE`, which represents the number of people in a student’s household when the student was in eighth grade. Use the frequency distribution table to answer the following questions:

a) What was the greatest number of people in a household for all the students in the NELS data set?

b) How many students lived in households with only three members?

c) How many students lived in households with at most three members?

d) What percentage of the students lived in households with only three members?

e) What percentage of the students lived in households with at most three members?

<details>
<summary>### Solution</summary>

a) 9 people.

b) 52 students.

c) 9 + 52 = 61 students.

d) 10.4%.

e) 12.2%.

</details>

### Exercise 2.4

Create a bar graph summarizing the variable `GENDER`. Use it to answer the following questions:

a) Why is a bar graph an appropriate display in this case?

b) Are there more males or females in the NELS?

c) What percentage of students is female?

<details>
<summary>### Solution</summary>

a) `GENDER` is a nominal variable.

b) There are more females: 273 females and 227 males.

c) 54.6%.

</details>

### Exercise 2.5

In this exercise, make separate bar graphs for males and females of the variable `ALCBINGE`, which indicates whether a student has ever binged on alcohol. For this question, you will learn how to split the data file in SPSS. To label the frequencies on a bar graph, you can refer to the instructions for Exercise 2.4.

a) What percentage of males in the NELS data set has ever binged on alcohol? What percentage of females?

b) Given the two frequency bar graphs, why are the scales on the vertical axes different for the two graphs?

<details>
<summary>### Solution</summary>

a) Males: $(66 / 227) \times 100 = 29.1\%$. Females: $(42 / 273) \times 100 = 15.4\%$.

b) The scales differ to accommodate the larger number of females who had never binged on alcohol.

</details>

### Exercise 2.10

Create a stem-and-leaf plot of the variable `BIRTH` from the Statisticians data set that you entered in Exercise 1.15. Use it to answer the following questions:

a) How many people in the data set were born in 1900?

b) Are there any outliers (i.e., extreme values) in this distribution?

c) How would you describe the shape of this distribution? Explain.

d) What is or are the most frequently occurring score or scores in this distribution? How many times does it or do they occur?

e) What is the highest score in this distribution?

f) Can we use this stem-and-leaf plot to obtain the original set of values for this variable?

<details>
<summary>### Solution</summary>

a) 1 person.

b) Yes. One statistician was born on or before 1822.

c) The distribution is negatively skewed because of the low outlier.

d) Two statisticians were born in 1893. No other pair of statisticians was born in the same year.

e) 1915.

f) No. The exact value of the outlier cannot be determined from the display.

</details>

### Exercise 2.12

Create a stem-and-leaf plot of total cholesterol, given by the variable `TOTCHOL1` found in the Framingham data set. Use it to answer the following questions:

b) Are there any outliers (i.e., extreme values) in this distribution? Describe them.

e) What is the highest score in this distribution?

f) Can we use this stem-and-leaf plot to obtain the complete set of original values for this variable?

<details>
<summary>### Solution</summary>

b) Yes. There are two people with initial cholesterol levels greater than or equal to 353.

e) The exact value cannot be determined because the highest score is recorded only as an extreme value greater than or equal to 353.

f) No. The scores are rounded to two significant digits, and the two outlier values are unknown.

</details>

b) According to the stem-and-leaf plot, approximately how many students received the lowest eighth-grade math achievement score?

c) According to the stem-and-leaf plot, are there any outliers (extreme values) in this distribution?

e) According to the stem-and-leaf plot, which eighth-grade math achievement score occurs most often?

<details>
<summary>### Solution</summary>

### Exercise 2.14

Follow the instructions to create separate stem-and-leaf plots of `SYSBP1` (systolic blood pressure) for men and women (`SEX`) using the Framingham data set. Use the plots to answer the following questions:

a) In which distribution, male or female, do we find the lowest systolic blood pressure value? Explain.

b) In which distribution is the most frequently occurring systolic blood pressure value higher? Explain.

c) In which, if either, distribution does systolic blood pressure have a greater spread? Explain.

d) In which, if either, distribution is systolic blood pressure more skewed? Explain.

<details>
<summary>### Solution</summary>

a) Female. The lowest values are 98 for males and 92 for females.

b) Female. The most frequently occurring values are 130 for males and 132 for females.

c) The distributions appear to be quite similar in spread.

d) The distributions appear similarly positively skewed.

</details>

### Exercise 2.16

Follow the instructions to create two side-by-side histograms for socioeconomic status, given by the variable `SES` in the NELS data set. Let one histogram represent students who did not own a computer in eighth grade and the other represent students who did own a computer (`COMPUTER`). Use the histograms to answer the following questions:

a) Which computer group has the single highest SES score?

b) Would you say that SES is higher for the group that owns a computer? Why or why not?

c) Do the SES values have more spread for one group than the other?

<details>
<summary>### Solution</summary>

a) The group that owned a computer in eighth grade.

b) Yes. SES appears higher for the group that owns a computer because its distribution begins and ends at higher points on the SES scale, and its scores are generally higher.

c) No. The spread of the two distributions appears quite similar.

</details>

### Exercise 2.21

Find the following values for a student’s expected income at age 30, given by the variable `EXPINC30` in the NELS data set:

a) What is the exact value of the 15th percentile, according to SPSS?

b) What is the exact value of the 50th percentile, according to SPSS?

c) What is the approximate percentile rank of an expected income of $50,000?

<details>
<summary>### Solution</summary>

a) $30,000. This means that 15% of students expect to earn less than $30,000 at age 30.

b) $40,000.

c) 73.9.

</details>

### Exercise 2.23

This question relates to the optimist who is expecting to earn $1,000,000 per year at age 30 (`EXPINC30 = 1,000,000`).

a) What is this student’s ID?

b) What was this student’s eighth-grade self-concept score (`SLFCNC08`)?

c) What is the percentile rank of this student’s eighth-grade self-concept score? Is it what you expected?

d) Use percentile ranks to determine the grade (eighth, tenth, or twelfth) in which this student was least self-confident relative to his or her peers.

<details>
<summary>### Solution</summary>

a) 102.

b) 25.

c) The percentile rank is 74.8%. This is higher than almost three-fourths of the students, although one might have expected the student’s self-concept to be even higher.

d) Twelfth grade. The percentile ranks are 74.8% in eighth grade, 88% in tenth grade, and 7.2% in twelfth grade.

</details>

### Exercise 2.24

Create a boxplot that shows the number of times a student in twelfth grade was recorded late for school, given by the variable `LATE12`. Note that the level of measurement of `LATE12` is ordinal. Use the boxplot and the scoring information in the data set to answer the following questions:

a) Estimate and interpret the value of the 50th percentile for `LATE12`, represented by the line in the middle of the box.

b) Estimate the IQR of this distribution.

d) What is the significance of the fact that the graph has no bottom whisker?

<details>
<summary>### Solution</summary>

a) The 50th percentile is 1. Since 1 means being late one or two times, half the students were late no more than one or two times.

b) The IQR is $2 - 0 = 2$.

d) The minimum score is the same as the 25th percentile. At least 25% of students were never late in twelfth grade.

</details>

### Exercise 2.25

c) Overall, which of the three grades has the highest level of self-concept?

d) Which of the three grades contains the highest single self-concept score? What is your estimate of that score?

<details>
<summary>### Solution</summary>

c) Twelfth grade, based on the 50th percentile.

d) Twelfth grade; approximately 43.

</details>

### Exercise 2.26

Create four boxplots on the same axis, one for each region, that plot the number of years of math taken in high school, given by the variable `UNITMATH` in the NELS data set. Use the graph to answer the following questions:

b) In which of the four regions is the overall level of `UNITMATH` lowest?

c) Which of the four regions contains the student with the single lowest number of units of math taken in high school? What is that number?

e) How many of the 106 students in the Northeast have `UNITMATH` scores between Q1 and Q2? Is this number confined to `UNITMATH` scores, or does it generalize to all variables in this data set?

<details>
<summary>### Solution</summary>

b) West.

c) West. There is a student in the Northeast who took only one year of math in high school.

e) Approximately $0.25 \times 106 = 27$ students. Because 25% of scores in any distribution fall between Q1 and Q2, this generalizes to all variables in the data set.

</details>

      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
